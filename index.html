<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Briefly — AI-помощник для писем</title>

<style>
:root {
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#667085;
  --accent:#3157d5;
  --line:#dce2ee;
  --error:#b42318;
}

* { box-sizing:border-box; }

body {
  margin:0;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

.wrap {
  max-width:900px;
  margin:auto;
  padding:40px 18px;
}

.hero {
  text-align:center;
  margin-bottom:28px;
}

.logo {
  font-size:24px;
  font-weight:900;
  color:var(--accent);
}

h1 {
  font-size:38px;
  margin:14px 0 8px;
}

.subtitle {
  color:var(--muted);
  font-size:17px;
}

.card {
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:24px;
  box-shadow:0 8px 30px rgba(20,35,70,.06);
}

label {
  display:block;
  font-weight:700;
  margin:18px 0 8px;
}

.modes {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.mode {
  border:1px solid var(--line);
  background:white;
  border-radius:12px;
  padding:15px 8px;
  cursor:pointer;
  font-weight:700;
}

.mode.active {
  border:2px solid var(--accent);
  background:#f3f6ff;
  color:var(--accent);
}

.languages {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

select,
input,
textarea {
  width:100%;
  border:1px solid var(--line);
  border-radius:11px;
  padding:13px;
  font:inherit;
  background:white;
}

textarea {
  min-height:150px;
  resize:vertical;
}

.categories {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.cat {
  border:1px solid var(--line);
  background:white;
  border-radius:10px;
  padding:11px;
  cursor:pointer;
}

.cat.active {
  border:2px solid var(--accent);
  color:var(--accent);
  background:#f3f6ff;
}

.row {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.generate {
  width:100%;
  margin-top:22px;
  padding:16px;
  border:0;
  border-radius:12px;
  background:var(--accent);
  color:white;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

.generate:disabled {
  opacity:.55;
  cursor:wait;
}

.result {
  display:none;
  margin-top:22px;
  padding:20px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fafbfe;
  white-space:pre-wrap;
  line-height:1.6;
}

.result.show {
  display:block;
}

.error {
  margin-top:16px;
  color:var(--error);
}

.copy {
  display:none;
  margin-top:10px;
  padding:10px 15px;
  border:1px solid var(--line);
  border-radius:9px;
  background:white;
  cursor:pointer;
}

.copy.show {
  display:inline-block;
}

.note {
  text-align:center;
  color:var(--muted);
  font-size:13px;
  margin-top:18px;
}

@media(max-width:650px) {
  h1 { font-size:30px; }

  .modes,
  .categories {
    grid-template-columns:1fr;
  }

  .languages,
  .row {
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="wrap">

<div class="hero">
  <div class="logo">Briefly ✨</div>

  <h1>Письма без языкового барьера</h1>

  <div class="subtitle">
    Создавайте, отвечайте и разбирайте письма с помощью AI.
  </div>
</div>


<div class="card">

<label>Что нужно сделать?</label>

<div class="modes">

<button
  class="mode active"
  data-mode="create">
  ✍️ Создать письмо
</button>

<button
  class="mode"
  data-mode="reply">
  ↩️ Ответить на письмо
</button>

<button
  class="mode"
  data-mode="explain">
  💡 Объяснить письмо
</button>

</div>


<div class="languages">

<div>
<label for="sourceLanguage">
Я пишу / письмо написано на
</label>

<select id="sourceLanguage">
<option>Автоматически</option>
<option>Русский</option>
<option>Украинский</option>
<option>Немецкий</option>
<option>Английский</option>
<option>Польский</option>
<option>Французский</option>
<option>Испанский</option>
<option>Итальянский</option>
</select>
</div>


<div>
<label for="targetLanguage">
Получить результат на
</label>

<select id="targetLanguage">
<option>Немецкий</option>
<option>Русский</option>
<option>Украинский</option>
<option>Английский</option>
<option>Польский</option>
<option>Французский</option>
<option>Испанский</option>
<option>Итальянский</option>
</select>
</div>

</div>


<div id="recipientBlock">

<label>Кому пишем?</label>

<div class="categories">

<button class="cat active"
data-recipient="Работодатель">
💼 Работодатель
</button>

<button class="cat"
data-recipient="Арендодатель">
🏠 Арендодатель
</button>

<button class="cat"
data-recipient="Ведомство">
🏛️ Ведомство
</button>

<button class="cat"
data-recipient="Страховая компания">
🩺 Страховая
</button>

<button class="cat"
data-recipient="Магазин">
🛒 Магазин
</button>

<button class="cat"
data-recipient="Другое">
✍️ Другое
</button>

</div>
</div>


<label id="textLabel" for="text">
Что вы хотите сообщить?
</label>

<textarea
id="text"
placeholder="Например: хочу попросить работодателя дать мне отпуск с 12 по 19 сентября.">
</textarea>


<div class="row">

<div>
<label for="tone">Тон</label>

<select id="tone">
<option>Вежливый</option>
<option>Официальный</option>
<option>Дружелюбный</option>
<option>Настойчивый</option>
<option>Краткий</option>
</select>
</div>


<div>
<label for="name">Ваше имя</label>

<input
id="name"
placeholder="Например: Анна">
</div>

</div>


<button
id="generate"
class="generate">
Создать письмо
</button>

<div id="error" class="error"></div>

<div id="result" class="result"></div>

<button
id="copy"
class="copy">
📋 Скопировать
</button>

</div>


<div class="note">
AI может ошибаться. Проверяйте имена, даты, суммы и важные сведения перед отправкой.
</div>

</div>


<script>

const WORKER_URL =
"https://rapid-term-dbe0.nadiiahonda34.workers.dev/";

let mode = "create";
let recipient = "Работодатель";


const modeButtons =
document.querySelectorAll(".mode");

const categoryButtons =
document.querySelectorAll(".cat");

const recipientBlock =
document.getElementById("recipientBlock");

const textLabel =
document.getElementById("textLabel");

const text =
document.getElementById("text");

const sourceLanguage =
document.getElementById("sourceLanguage");

const targetLanguage =
document.getElementById("targetLanguage");

const tone =
document.getElementById("tone");

const name =
document.getElementById("name");

const generate =
document.getElementById("generate");

const result =
document.getElementById("result");

const errorBox =
document.getElementById("error");

const copy =
document.getElementById("copy");


modeButtons.forEach(button => {

button.addEventListener("click", () => {

modeButtons.forEach(x =>
x.classList.remove("active"));

button.classList.add("active");

mode = button.dataset.mode;

updateMode();

});

});


categoryButtons.forEach(button => {

button.addEventListener("click", () => {

categoryButtons.forEach(x =>
x.classList.remove("active"));

button.classList.add("active");

recipient =
button.dataset.recipient;

});

});


function updateMode() {

result.classList.remove("show");
copy.classList.remove("show");
errorBox.textContent = "";

if (mode === "create") {

recipientBlock.style.display = "block";

textLabel.textContent =
"Что вы хотите сообщить?";

text.placeholder =
"Например: хочу попросить работодателя дать мне отпуск с 12 по 19 сентября.";

generate.textContent =
"Создать письмо";

}

if (mode === "reply") {

recipientBlock.style.display = "none";

textLabel.textContent =
"Вставьте полученное письмо";

text.placeholder =
"Вставьте сюда письмо, на которое хотите ответить...";

generate.textContent =
"Подготовить ответ";

}

if (mode === "explain") {

recipientBlock.style.display = "none";

textLabel.textContent =
"Вставьте письмо";

text.placeholder =
"Вставьте сюда письмо, которое хотите понять...";

generate.textContent =
"Объяснить письмо";

}

}


generate.addEventListener(
"click",
async () => {

const inputText =
text.value.trim();

if (!inputText) {

errorBox.textContent =
"Введите текст.";

return;
}

errorBox.textContent = "";

result.classList.remove("show");
copy.classList.remove("show");

generate.disabled = true;

const oldButtonText =
generate.textContent;

generate.textContent =
"AI работает...";


try {

const response =
await fetch(WORKER_URL, {

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

mode:mode,

text:inputText,

sourceLanguage:
sourceLanguage.value,

targetLanguage:
targetLanguage.value,

recipient:recipient,

tone:tone.value,

name:name.value.trim()

})

});


const data =
await response.json();


if (!response.ok) {

throw new Error(
data.details ||
data.error ||
"Ошибка сервера"
);

}


const output =
data.result ||
data.letter;


if (!output) {

throw new Error(
"AI не вернул результат."
);

}


result.textContent =
output;

result.classList.add("show");

copy.classList.add("show");


} catch(err) {

console.error(err);

errorBox.textContent =
"Не удалось выполнить запрос: " +
err.message;

}


generate.disabled = false;

generate.textContent =
oldButtonText;

});


copy.addEventListener(
"click",
async () => {

try {

await navigator.clipboard.writeText(
result.textContent
);

copy.textContent =
"✓ Скопировано";

setTimeout(() => {

copy.textContent =
"📋 Скопировать";

},1500);

} catch {

alert(
"Не удалось скопировать текст."
);

}

});


updateMode();

</script>

</body>
</html>
