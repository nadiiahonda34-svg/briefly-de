function update(){const t=T[uiLang];document.documentElement.lang=uiLang;document.documentElement.dir=uiLang==="ar"?"rtl":"ltr";title.textContent=t.title;subtitle.textContent=t.subtitle;actionLabel.textContent=t.action;createMode.textContent=t.create;replyMode.textContent=t.reply;explainMode.textContent=t.explain;sourceLabel.textContent=t.source;targetLabel.textContent=t.target;recipientLabel.textContent=t.recipient;catButtons.forEach(b=>b.textContent=t[b.dataset.key]);toneLabel.textContent=t.tone;nameLabel.textContent=t.name;nameInput.placeholder=t.namePh;intentLabel.textContent=t.intent;replyInstruction.placeholder=t.intentPh;copy.textContent=t.copy;note.textContent=t.note;fillLanguages();fillTones();updateMode()}
uiLanguage.addEventListener("change",e=>{uiLang=e.target.value;localStorage.setItem("briefly-ui-lang",uiLang);update()});
modeButtons.forEach(b=>b.addEventListener("click",()=>{modeButtons.forEach(x=>x.classList.remove("active"));b.classList.add("active");mode=b.dataset.mode;updateMode()}));
catButtons.forEach(b=>b.addEventListener("click",()=>{catButtons.forEach(x=>x.classList.remove("active"));b.classList.add("active");recipientKey=b.dataset.key}));
generate.addEventListener("click",async()=>{const t=T[uiLang],input=text.value.trim(),instruction=replyInstruction.value.trim();if(!input){errorBox.textContent=t.empty;return}errorBox.textContent="";result.classList.remove("show");copy.classList.remove("show");const old=generate.textContent;generate.disabled=true;generate.textContent=t.wait;try{const response=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mode,situation:input,text:input,message:input,instruction:instruction,replyInstruction:instruction,intent:instruction,sourceLanguage:sourceLanguage.value,targetLanguage:targetLanguage.value,language:targetLanguage.value,recipient:t[recipientKey],recipientKey,tone:tone.value,name:nameInput.value.trim(),uiLanguage:uiLang,preserveFacts:true,preserveDates:true,naturalReply:true,noInventedDates:true})});const raw=await response.text();let data;try{data=raw?JSON.parse(raw):{}}catch{throw new Error(raw||"Invalid server response")}if(!response.ok)throw new Error(data.details||data.error||`Server error (${response.status})`);const output=data.result||data.letter||data.output||data.text||data.reply||data.answer||data.message||data?.choices?.[0]?.message?.content;if(typeof output!=="string"||!output.trim())throw new Error(data.error||"No result returned by the server");result.textContent=output.trim();result.classList.add("show");copy.classList.add("show")}catch(e){errorBox.textContent=t.error+(e?.message||String(e))}finally{generate.disabled=false;generate.textContent=old}});
copy.addEventListener("click",async()=>{const t=T[uiLang];try{await navigator.clipboard.writeText(result.textContent);copy.textContent=t.copied;setTimeout(()=>copy.textContent=t.copy,1500)}catch{errorBox.textContent=t.error}});
fillUi();update();
</script></body></html>
