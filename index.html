<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Briefly — AI Letter Assistant</title>

<style>
:root{
  --bg:#f5f7fb;
  --card:#fff;
  --text:#172033;
  --muted:#667085;
  --accent:#3157d5;
  --line:#dce2ee;
  --error:#b42318;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:25px 18px 40px;
}

.top{
  display:flex;
  justify-content:flex-end;
  margin-bottom:15px;
}

.language-select{
  width:auto;
  min-width:155px;
  padding:9px 12px;
  border:1px solid var(--line);
  border-radius:10px;
  background:white;
  font:inherit;
}

.hero{
  text-align:center;
  margin-bottom:28px;
}

.logo{
  font-size:25px;
  font-weight:900;
  color:var(--accent);
}

h1{
  font-size:38px;
  margin:14px 0 8px;
}

.subtitle{
  color:var(--muted);
  font-size:17px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:24px;
  box-shadow:0 8px 30px rgba(20,35,70,.06);
}

label{
  display:block;
  font-weight:700;
  margin:18px 0 8px;
}

.modes{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.mode{
  border:1px solid var(--line);
  background:white;
  border-radius:12px;
  padding:15px 8px;
  cursor:pointer;
  font-weight:700;
}

.mode.active{
  border:2px solid var(--accent);
  background:#f3f6ff;
  color:var(--accent);
}

.languages{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

select,input,textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:11px;
  padding:13px;
  font:inherit;
  background:white;
}

textarea{
  min-height:150px;
  resize:vertical;
}

.categories{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.cat{
  border:1px solid var(--line);
  background:white;
  border-radius:10px;
  padding:11px;
  cursor:pointer;
}

.cat.active{
  border:2px solid var(--accent);
  color:var(--accent);
  background:#f3f6ff;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.generate{
  width:100%;
  margin-top:22px;
  padding:16px;
  border:0;
  border-radius:12px;
  background:var(--accent);
  color:white;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

.generate:disabled{
  opacity:.55;
  cursor:wait;
}

.result{
  display:none;
  margin-top:22px;
  padding:20px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fafbfe;
  white-space:pre-wrap;
  line-height:1.6;
}

.result.show{display:block}

.error{
  margin-top:16px;
  color:var(--error);
}

.copy{
  display:none;
  margin-top:10px;
  padding:10px 15px;
  border:1px solid var(--line);
  border-radius:9px;
  background:white;
  cursor:pointer;
}

.copy.show{display:inline-block}

.note{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  margin-top:18px;
}

@media(max-width:650px){
  h1{font-size:30px}
  .modes,.categories{grid-template-columns:1fr}
  .languages,.row{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="wrap">

<div class="top">
<select id="uiLanguage" class="language-select">
  <option value="de">Deutsch</option>
  <option value="en">English</option>
  <option value="ru" selected>Русский</option>
  <option value="uk">Українська</option>
  <option value="pl">Polski</option>
  <option value="ar">العربية</option>
</select>
</div>

<div class="hero">
  <div class="logo">Briefly ✨</div>
  <h1 id="title"></h1>
  <div id="subtitle" class="subtitle"></div>
</div>

<div class="card">

<label id="actionLabel"></label>

<div class="modes">
<button class="mode active" data-mode="create" id="createMode"></button>
<button class="mode" data-mode="reply" id="replyMode"></button>
<button class="mode" data-mode="explain" id="explainMode"></button>
</div>

<div class="languages">

<div>
<label id="sourceLabel"></label>
<select id="sourceLanguage"></select>
</div>

<div>
<label id="targetLabel"></label>
<select id="targetLanguage"></select>
</div>

</div>

<div id="recipientBlock">

<label id="recipientLabel"></label>

<div class="categories">

<button class="cat active"
data-recipient="Работодатель"
data-key="employer"></button>

<button class="cat"
data-recipient="Арендодатель"
data-key="landlord"></button>

<button class="cat"
data-recipient="Ведомство"
data-key="authority"></button>

<button class="cat"
data-recipient="Страховая компания"
data-key="insurance"></button>

<button class="cat"
data-recipient="Магазин"
data-key="shop"></button>

<button class="cat"
data-recipient="Другое"
data-key="other"></button>

</div>
</div>

<label id="textLabel" for="text"></label>
<textarea id="text"></textarea>

<div class="row">

<div>
<label id="toneLabel" for="tone"></label>
<select id="tone"></select>
</div>

<div>
<label id="nameLabel" for="name"></label>
<input id="name">
</div>

</div>

<button id="generate" class="generate"></button>

<div id="error" class="error"></div>
<div id="result" class="result"></div>
<button id="copy" class="copy"></button>

</div>

<div id="note" class="note"></div>

</div>

<script>
const translations = {
  ru: {
    title: "Briefly ✨",
    subtitle: "Помощник для писем и сообщений",
    action: "Что нужно сделать?",

    create: "Создать",
    reply: "Ответить",
    explain: "Объяснить",

    source: "Исходный язык",
    target: "Язык результата",
    recipient: "Получатель",

    employer: "Работодатель",
    landlord: "Арендодатель",
    authority: "Ведомство",
    insurance: "Страховая компания",
    shop: "Магазин",
    other: "Другое",

    tone: "Тон",
    name: "Имя (необязательно)",
    namePlaceholder: "Например: Анна",

    textCreate: "Что вы хотите написать?",
    textReply: "Вставьте сообщение, на которое нужно ответить",
    textExplain: "Вставьте текст, который нужно объяснить",

    placeholderCreate: "Опишите ситуацию...",
    placeholderReply: "Вставьте полученное сообщение...",
    placeholderExplain: "Вставьте текст...",

    buttonCreate: "Создать текст",
    buttonReply: "Создать ответ",
    buttonExplain: "Объяснить",

    copy: "Копировать",
    copied: "Скопировано!",
    working: "Подождите...",
    empty: "Введите текст.",
    error: "Ошибка: "
  }
};
const languages = {
  auto: "Автоматически",
  de: "Немецкий",
  en: "Английский",
  ru: "Русский",
  uk: "Украинский",
  pl: "Польский",
  fr: "Французский",
  es: "Испанский",
  it: "Итальянский",
  ar: "Арабский"
};

const languagesAr = {
  auto: "تلقائي",
  de: "الألمانية",
  en: "الإنجليزية",
  ru: "الروسية",
  uk: "الأوكرانية",
  pl: "البولندية",
  fr: "الفرنسية",
  es: "الإسبانية",
  it: "الإيطالية",
  ar: "العربية"
};



const languagesByUi = {
  ru: {
    auto: "Автоматически",
    de: "Немецкий",
    en: "Английский",
    ru: "Русский",
    uk: "Украинский",
    pl: "Польский",
    fr: "Французский",
    es: "Испанский",
    it: "Итальянский",
    ar: "Арабский"
  },

  de: {
    auto: "Automatisch",
    de: "Deutsch",
    en: "Englisch",
    ru: "Russisch",
    uk: "Ukrainisch",
    pl: "Polnisch",
    fr: "Französisch",
    es: "Spanisch",
    it: "Italienisch",
    ar: "Arabisch"
  },

  en: {
    auto: "Automatically",
    de: "German",
    en: "English",
    ru: "Russian",
    uk: "Ukrainian",
    pl: "Polish",
    fr: "French",
    es: "Spanish",
    it: "Italian",
    ar: "Arabic"
  },

  uk: {
    auto: "Автоматично",
    de: "Німецька",
    en: "Англійська",
    ru: "Російська",
    uk: "Українська",
    pl: "Польська",
    fr: "Французька",
    es: "Іспанська",
    it: "Італійська",
    ar: "Арабська"
  },

  pl: {
    auto: "Automatycznie",
    de: "Niemiecki",
    en: "Angielski",
    ru: "Rosyjski",
    uk: "Ukraiński",
    pl: "Polski",
    fr: "Francuski",
    es: "Hiszpański",
    it: "Włoski",
    ar: "Arabski"
  },

  fr: {
    auto: "Automatique",
    de: "Allemand",
    en: "Anglais",
    ru: "Russe",
    uk: "Ukrainien",
    pl: "Polonais",
    fr: "Français",
    es: "Espagnol",
    it: "Italien",
    ar: "Arabe"
  },

  es: {
    auto: "Automático",
    de: "Alemán",
    en: "Inglés",
    ru: "Ruso",
    uk: "Ucraniano",
    pl: "Polaco",
    fr: "Francés",
    es: "Español",
    it: "Italiano",
    ar: "Árabe"
  },

  it: {
    auto: "Automatico",
    de: "Tedesco",
    en: "Inglese",
    ru: "Russo",
    uk: "Ucraino",
    pl: "Polacco",
    fr: "Francese",
    es: "Spagnolo",
    it: "Italiano",
    ar: "Arabo"
  },

  ar: {
    auto: "تلقائي",
    de: "الألمانية",
    en: "الإنجليزية",
    ru: "الروسية",
    uk: "الأوكرانية",
    pl: "البولندية",
    fr: "الفرنسية",
    es: "الإسبانية",
    it: "الإيطالية",
    ar: "العربية"
  }
};

let uiLang="ru";
let mode="create";
let recipient="Работодатель";

const WORKER_URL="https://rapid-term-dbe0.nadiiahonda34.workers.dev/";

const $ = id => document.getElementById(id);

const modeButtons=document.querySelectorAll(".mode");
const categoryButtons=document.querySelectorAll(".cat");

function fillLanguageSelects(){

 const source=$("sourceLanguage");
 const target=$("targetLanguage");

 source.innerHTML="";
 target.innerHTML="";

 

const currentLanguages = languagesByUi[uiLang] || languagesByUi.ru;

Object.entries(currentLanguages).forEach(([key, value]) => {
    const sourceOption = document.createElement("option");
    sourceOption.value = key;
    sourceOption.textContent = value;
    source.appendChild(sourceOption);

    if (key !== "auto") {
        const targetOption = document.createElement("option");
        targetOption.value = key;
        targetOption.textContent = value;
        target.appendChild(targetOption);
    }
});

source.value = "auto";
target.selectedIndex = 0;

const tonesByLanguage = {
  ru: ["Официальный", "Вежливый", "Дружелюбный", "Подробный"],
  de: ["Formell", "Höflich", "Freundlich", "Ausführlich"],
  en: ["Formal", "Polite", "Friendly", "Detailed"],
  uk: ["Офіційний", "Ввічливий", "Дружній", "Детальний"],
  pl: ["Formalny", "Uprzejmy", "Przyjazny", "Szczegółowy"],
  fr: ["Formel", "Poli", "Amical", "Détaillé"],
  es: ["Formal", "Cortés", "Amable", "Detallado"],
  it: ["Formale", "Cortese", "Amichevole", "Dettagliato"],
  ar: ["رسمي", "مهذب", "ودود", "مفصل"]
};

const tones = tonesByLanguage[uiLang] || tonesByLanguage.ru;

$("tone").innerHTML = "";

tones.forEach(value => {
  const option = document.createElement("option");
  option.value = value;
  option.textContent = value;
  $("tone").appendChild(option);
}); 
  
}

function updateInterface(){

 const t=translations[uiLang];

 document.documentElement.lang=uiLang;

 $("title").textContent=t.title;
 $("subtitle").textContent=t.subtitle;
 $("actionLabel").textContent=t.action;

 $("createMode").textContent=t.create;
 $("replyMode").textContent=t.reply;
 $("explainMode").textContent=t.explain;

 $("sourceLabel").textContent=t.source;
 $("targetLabel").textContent=t.target;
 $("recipientLabel").textContent=t.recipient;

 categoryButtons.forEach(button=>{
   button.textContent=t[button.dataset.key];
 });

 $("toneLabel").textContent=t.tone;
 $("nameLabel").textContent=t.name;
 $("name").placeholder=t.namePlaceholder;

 $("copy").textContent=t.copy;
 $("note").textContent=t.note;
const tonesByLanguage = {
  ru: ["Официальный", "Вежливый", "Дружелюбный", "Подробный"],
  de: ["Formell", "Höflich", "Freundlich", "Ausführlich"],
  en: ["Formal", "Polite", "Friendly", "Detailed"],
  uk: ["Офіційний", "Ввічливий", "Дружній", "Детальний"],
  pl: ["Formalny", "Uprzejmy", "Przyjazny", "Szczegółowy"],
  fr: ["Formel", "Poli", "Amical", "Détaillé"],
  es: ["Formal", "Cortés", "Amable", "Detallado"],
  it: ["Formale", "Cortese", "Amichevole", "Dettagliato"],
  ar: ["رسمي", "مهذب", "ودود", "مفصل"]
};

$("tone").innerHTML = "";

(tonesByLanguage[uiLang] || tonesByLanguage.ru).forEach(value => {
  const option = document.createElement("option");
  option.value = value;
  option.textContent = value;
  $("tone").appendChild(option);
});
 updateMode();
}

function updateMode(){

 const t=translations[uiLang];

 $("result").classList.remove("show");
 $("copy").classList.remove("show");
 $("error").textContent="";

 if(mode==="create"){
   $("recipientBlock").style.display="block";
   $("textLabel").textContent=t.textCreate;
   $("text").placeholder=t.placeholderCreate;
   $("generate").textContent=t.buttonCreate;
 }

 if(mode==="reply"){
   $("recipientBlock").style.display="none";
   $("textLabel").textContent=t.textReply;
   $("text").placeholder=t.placeholderReply;
   $("generate").textContent=t.buttonReply;
 }

 if(mode==="explain"){
   $("recipientBlock").style.display="none";
   $("textLabel").textContent=t.textExplain;
   $("text").placeholder=t.placeholderExplain;
   $("generate").textContent=t.buttonExplain;
 }
}

$("uiLanguage").addEventListener("change",e=>{
 uiLang=e.target.value;
 updateInterface();
});

modeButtons.forEach(button=>{
 button.addEventListener("click",()=>{
   modeButtons.forEach(x=>x.classList.remove("active"));
   button.classList.add("active");
   mode=button.dataset.mode;
   updateMode();
 });
});

categoryButtons.forEach(button=>{
 button.addEventListener("click",()=>{
   categoryButtons.forEach(x=>x.classList.remove("active"));
   button.classList.add("active");
   recipient=button.dataset.recipient;
 });
});

$("generate").addEventListener("click",async()=>{

 const t=translations[uiLang];
 const input=$("text").value.trim();

 if(!input){
   $("error").textContent=t.empty;
   return;
 }

 $("error").textContent="";
 $("result").classList.remove("show");
 $("copy").classList.remove("show");

 $("generate").disabled=true;
 const oldText=$("generate").textContent;
 $("generate").textContent=t.working;

 try{

   const response=await fetch(WORKER_URL,{
     method:"POST",
     headers:{
       "Content-Type":"application/json"
     },
     body:JSON.stringify({
       mode,
       situation:input,
       text:input,
       sourceLanguage:$("sourceLanguage").value,
       language: $("targetLanguage").value,
       recipient,
       tone:$("tone").value,
       name:$("name").value.trim()
     })
   });

   const raw=await response.text();

   let data={};

   try{
     data=raw ? JSON.parse(raw) : {};
   }catch{
     throw new Error(
       raw || "Server returned an invalid response"
     );
   }

   if(!response.ok){
     throw new Error(
       data.details ||
       data.error ||
       `Server error (${response.status})`
     );
   }

   const output=
     data.result ||
     data.letter ||
     data.output ||
     data.text;

   if(!output){
     throw new Error("No result");
   }

   $("result").textContent=output;
   $("result").classList.add("show");
   $("copy").classList.add("show");

 }catch(err){

   $("error").textContent=
     t.error+err.message;

 }

 $("generate").disabled=false;
 $("generate").textContent=oldText;

});

$("copy").addEventListener("click",async()=>{

 const t=translations[uiLang];

 try{
   await navigator.clipboard.writeText(
     $("result").textContent
   );

   $("copy").textContent=t.copied;

   setTimeout(()=>{
     $("copy").textContent=t.copy;
   },1500);

 }catch{
   alert(t.error);
 }

});

fillLanguageSelects();
updateInterface();

</script>

</body>
</html>
