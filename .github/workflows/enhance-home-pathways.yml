name: Enhance Briefly homepage pathways

on:
  push:
    paths:
      - '.github/workflows/enhance-home-pathways.yml'

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add practical pathways to homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<section class="section" id="how">'
          if 'id="practical-pathways"' in s:
              print('Homepage pathways already present')
              raise SystemExit(0)
          block = '''<section class="section" id="practical-pathways" aria-labelledby="pathways-title">
  <div class="section-head">
    <span class="eyebrow">Praktische Wege</span>
    <h2 id="pathways-title">Nicht nur schreiben: erst verstehen, dann sicher antworten</h2>
    <p>Für typische Schreiben in Deutschland verbindet Briefly Erklärung, passende Ratgeber, Formulierung und die Kontrolle vor dem Versand.</p>
  </div>
  <div class="resource-grid">
    <a class="resource-card" href="wege.html"><span class="tag">Start</span><h3>Den passenden Briefly-Weg finden</h3><p>Jobcenter, Behörden, Wohnung, Arbeit oder Versicherung: ordnen Sie Ihr Schreiben ein und gehen Sie Schritt für Schritt weiter.</p><span class="read">Praktische Wege öffnen →</span></a>
    <a class="resource-card" href="ratgeber.html"><span class="tag">Verstehen</span><h3>28 Ratgeber für konkrete Situationen</h3><p>Lesen Sie zuerst, welche Angaben, Fristen und nächsten Schritte bei Ihrem Schreiben wichtig sind.</p><span class="read">Ratgeber durchsuchen →</span></a>
    <a class="resource-card" href="#top"><span class="tag">Antworten</span><h3>Antwort mit Briefly vorbereiten</h3><p>Wenn die Fakten klar sind, erstellen oder formulieren Sie eine passende Antwort in der gewünschten Sprache.</p><span class="read">Generator verwenden →</span></a>
    <a class="resource-card" href="brief-checkliste.html"><span class="tag">Prüfen</span><h3>Vor dem Absenden kontrollieren</h3><p>Prüfen Sie Namen, Daten, Fristen, Beträge, Anlagen und Empfänger mit der interaktiven Checkliste.</p><span class="read">Checkliste öffnen →</span></a>
  </div>
  <div class="links" style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px">
    <a href="jobcenter-briefe-verstehen.html">Jobcenter</a>
    <a href="behoerdenbriefe-verstehen.html">Behörden</a>
    <a href="vermieter-brief-verstehen.html">Wohnen</a>
    <a href="krankmeldung-arbeitgeber.html">Arbeit</a>
    <a href="krankenkasse-brief-verstehen.html">Krankenkasse</a>
    <a href="versicherung-schaden-melden.html">Versicherung</a>
  </div>
</section>
'''
          if marker not in s:
              raise SystemExit('Expected homepage marker not found')
          s = s.replace(marker, block + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit homepage enhancement
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Strengthen homepage with practical Briefly pathways"
          git push
