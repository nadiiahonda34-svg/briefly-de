name: Fix Briefly header and favicon
on:
  push:
    paths:
      - '.github/workflows/fix-header-favicon.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          favicon='<link rel="icon" type="image/x-icon" href="favicon.ico?v=5">'
          if 'rel="icon"' not in s:
              marker='<meta name="robots" content="index, follow">'
              s=s.replace(marker, marker+'\n'+favicon, 1)
          s=s.replace('.top{position:sticky;top:14px;', '.top{position:relative;top:auto;', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Stop sticky header and connect favicon"
          git push
