name: Briefly custom-domain migration
on:
  push:
    paths:
      - '.github/workflows/fix-header-favicon.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace legacy GitHub Pages URLs safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old='https://nadiiahonda34-svg.github.io/briefly-de/'
          new='https://brieflyletters.com/'
          changed=[]
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              t=s.replace(old,new)
              if t != s:
                  p.write_text(t,encoding='utf-8')
                  changed.append(p.name)
          print('Updated:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit migrated HTML URLs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Migrate HTML canonical URLs to brieflyletters.com"
          git push
