name: Briefly public site check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-site-check.yml'
      - 'scripts/check_public_site.py'
      - '*.html'
      - '*.css'
      - '*.js'
      - '*.mjs'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'ads.txt'
      - 'tests/**'
  page_build:
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: briefly-public-site-check-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check letter templates and language links
        run: node --test tests/letter-templates.test.mjs
      - name: Check HTTPS, published pages and backend preflight
        run: python3 scripts/check_public_site.py
