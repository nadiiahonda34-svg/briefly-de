name: Briefly public site check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-site-check.yml'
      - 'scripts/check_public_site.py'
      - 'scripts/apply_seo.py'
      - 'scripts/fix_sitemap.py'
  page_build:
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: briefly-public-site-check-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: true
          fetch-depth: 0
      - name: Apply SEO improvements
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          python3 scripts/apply_seo.py
          python3 scripts/fix_sitemap.py
      - name: Commit SEO improvements
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No SEO changes needed."
          else
            git config user.name "Briefly SEO Bot"
            git config user.email "actions@users.noreply.github.com"
            git add index.html ratgeber.html robots.txt sitemap.xml *.html
            git commit -m "Improve Briefly SEO and indexing"
            git push origin HEAD:main
          fi
      - name: Check HTTPS, published pages and backend preflight
        run: python3 scripts/check_public_site.py
